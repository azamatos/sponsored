name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, lint, format, unit tests, image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # the images the server runs: prove the lockfile and the Dockerfiles still build
      - run: docker build -f apps/pipeline/Dockerfile -t sponsored-pipeline .
      - run: docker build -f apps/web/Dockerfile -t sponsored-web .
