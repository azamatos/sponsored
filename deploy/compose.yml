# Sponsored on a small Docker server: its own Postgres, the pipeline and the site, no public ports (the shared Caddy
# in /srv/edge serves the site).
# Lives at /srv/sponsored (code in src/, secrets in .env, never in git). Deploy and timers: deploy/README.md.
name: sponsored
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sponsored
      POSTGRES_DB: sponsored
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /srv/sponsored/.env}
    # sized for a share of an 8 GB server that runs other projects too
    command:
      [
        postgres,
        -c,
        shared_buffers=256MB,
        -c,
        effective_cache_size=1GB,
        -c,
        work_mem=16MB,
        -c,
        maintenance_work_mem=128MB,
      ]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsored"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m

  # runs one command and exits: `docker compose run --rm pipeline <command>` (the systemd timers do this)
  pipeline:
    build:
      context: ./src
      dockerfile: apps/pipeline/Dockerfile
    image: sponsored-pipeline:latest
    environment:
      DATABASE_URL: postgres://sponsored:${POSTGRES_PASSWORD}@db:5432/sponsored
      # Extraction runs Claude Code on the owner's subscription (`claude setup-token`). Never set ANTHROPIC_API_KEY
      # here: Claude Code would use it instead and bill the API.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
    mem_limit: 1g
    cpus: 1.5

  # The site: Nuxt's server, reading the database as "site", a read-only user (deploy.sh sets it up). The shared
  # Caddy reaches it on the "edge" network as sponsored-web.
  web:
    build:
      context: ./src
      dockerfile: apps/web/Dockerfile
    image: sponsored-web:latest
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgres://site:${WEB_DB_PASSWORD:-}@db:5432/sponsored
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: [sponsored-web]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 384m
    cpus: 1

volumes:
  pgdata:

networks:
  edge:
    external: true
